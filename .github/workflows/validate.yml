name: Pull

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7

      - name: Setup Node
        uses: actions/setup-node@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          node-version: 20

      - name: Lint markdown
        run: npx markdownlint-cli2 "slides.md"

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7

      - name: Setup Node
        uses: actions/setup-node@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Build slides
        run: npx slidev build --base /Harvest_CI-CD/

      - name: Upload build output
        uses: actions/upload-artifact@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          name: slidev-build-output
          path: dist
          retention-days: 7
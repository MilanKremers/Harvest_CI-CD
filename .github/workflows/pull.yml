name: Pull

on:
    pull_request:
        branches: [main]
        paths:
          - 'slides.md'
          - 'components/**'
          - 'package.json'
          - 'pnpm-lock.yaml'

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
        
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
      - name: Build slides
        run: npx slidev build --base /Harvest_CI-CD/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist



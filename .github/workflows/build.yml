name: Build

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you manually redeploying?'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
      - name: Setup Node
        uses: actions/setup-node@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
      - name: Build slides
        run: npx slidev build --base /Harvest_CI-CD/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7